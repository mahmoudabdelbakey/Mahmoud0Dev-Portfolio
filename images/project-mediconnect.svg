<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="medGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B2423" />
      <stop offset="100%" stop-color="#141819" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" rx="12" fill="url(#medGrad)" />

  <!-- App Header -->
  <rect width="600" height="40" fill="#151E1C" rx="12 12 0 0" />
  <circle cx="25" cy="20" r="5" fill="#E06C75" />
  <circle cx="45" cy="20" r="5" fill="#E5C07B" />
  <circle cx="65" cy="20" r="5" fill="#98C379" />
  <rect x="120" y="10" width="360" height="20" rx="4" fill="#1F2E2B" />
  <text x="215" y="24" fill="#7D9893" font-family="sans-serif" font-size="11">portal.mediconnect-health.internal/schedules</text>

  <!-- Left Sidebar -->
  <rect x="0" y="40" width="130" height="320" fill="#16201E" />
  <rect x="15" y="65" width="100" height="12" rx="3" fill="#2E6B65" />
  <rect x="15" y="90" width="80" height="8" rx="2" fill="#283B37" />
  <rect x="15" y="110" width="90" height="8" rx="2" fill="#283B37" />
  <rect x="15" y="130" width="70" height="8" rx="2" fill="#283B37" />

  <!-- Calendar Scheduling Interface Grid -->
  <rect x="150" y="60" width="425" height="120" rx="8" fill="#1C2725" stroke="#283E3A" stroke-width="1" />
  <text x="170" y="85" fill="#EEF4F1" font-family="sans-serif" font-size="13" font-weight="bold">Doctor Shift Availability &amp; Conflict-Free Booking</text>
  
  <!-- Time Slots -->
  <g transform="translate(170, 105)">
    <rect x="0" y="0" width="75" height="32" rx="4" fill="#245A54" />
    <text x="14" y="20" fill="#FFFFFF" font-family="sans-serif" font-size="11">09:00 AM</text>

    <rect x="85" y="0" width="75" height="32" rx="4" fill="#245A54" />
    <text x="99" y="20" fill="#FFFFFF" font-family="sans-serif" font-size="11">09:30 AM</text>

    <rect x="170" y="0" width="75" height="32" rx="4" fill="#3D4E4A" />
    <text x="184" y="20" fill="#A2B4B0" font-family="sans-serif" font-size="11">10:00 AM</text>

    <rect x="255" y="0" width="75" height="32" rx="4" fill="#2E6B65" />
    <text x="269" y="20" fill="#FFFFFF" font-family="sans-serif" font-size="11">10:30 AM</text>

    <rect x="340" y="0" width="75" height="32" rx="4" fill="#245A54" />
    <text x="354" y="20" fill="#FFFFFF" font-family="sans-serif" font-size="11">11:00 AM</text>
  </g>

  <!-- Teleconsultation / Patient Queue Box -->
  <rect x="150" y="195" width="425" height="135" rx="8" fill="#1A2422" stroke="#2E6B65" stroke-width="1" />
  <text x="170" y="225" fill="#E2EBE6" font-family="sans-serif" font-size="13" font-weight="bold">Real-Time Patient Consultation Queue (EF Core Concurrency)</text>
  
  <rect x="170" y="245" width="385" height="32" rx="6" fill="#23322F" />
  <circle cx="190" cy="261" r="7" fill="#6E897B" />
  <text x="210" y="265" fill="#FFFFFF" font-family="sans-serif" font-size="12">Patient #8210 - Confirmed (Auto-reminder Sent via SMS)</text>

  <rect x="170" y="285" width="385" height="32" rx="6" fill="#23322F" />
  <circle cx="190" cy="301" r="7" fill="#3A7871" />
  <text x="210" y="305" fill="#FFFFFF" font-family="sans-serif" font-size="12">Patient #8211 - In Session (HIPAA Audit Log Active)</text>
</svg>
