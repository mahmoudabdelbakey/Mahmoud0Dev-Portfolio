<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="comGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1F24" />
      <stop offset="100%" stop-color="#12171B" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" rx="12" fill="url(#comGrad)" />

  <!-- App Header -->
  <rect width="600" height="40" fill="#15191D" rx="12 12 0 0" />
  <circle cx="25" cy="20" r="5" fill="#E06C75" />
  <circle cx="45" cy="20" r="5" fill="#E5C07B" />
  <circle cx="65" cy="20" r="5" fill="#98C379" />
  <rect x="120" y="10" width="360" height="20" rx="4" fill="#20272D" />
  <text x="210" y="24" fill="#75828C" font-family="sans-serif" font-size="11">api.commercecraft-store.io/checkout/v1</text>

  <!-- Product Checkout Flow -->
  <rect x="30" y="60" width="320" height="270" rx="8" fill="#1D242A" stroke="#2B363E" stroke-width="1" />
  <text x="50" y="90" fill="#F4F6F7" font-family="sans-serif" font-size="14" font-weight="bold">Atomic Flash-Sale Checkout Pipeline</text>
  
  <rect x="50" y="110" width="280" height="40" rx="6" fill="#242E35" />
  <text x="65" y="135" fill="#94AC9F" font-family="sans-serif" font-size="12">1. Stock Reservation (RowLock Active - 10m Lease)</text>

  <rect x="50" y="160" width="280" height="40" rx="6" fill="#242E35" />
  <text x="65" y="185" fill="#94AC9F" font-family="sans-serif" font-size="12">2. Payment Webhook (Idempotent Key Checked)</text>

  <rect x="50" y="210" width="280" height="40" rx="6" fill="#245A54" />
  <text x="65" y="235" fill="#FFFFFF" font-family="sans-serif" font-size="12">3. SQL Stored Proc: Decrement &amp; Ledger Commit</text>

  <rect x="50" y="260" width="280" height="40" rx="6" fill="#242E35" />
  <text x="65" y="285" fill="#94AC9F" font-family="sans-serif" font-size="12">4. Event Dispatch: OrderConfirmed -&gt; Dispatch</text>

  <!-- Metrics / Analytics Box -->
  <rect x="370" y="60" width="200" height="125" rx="8" fill="#1C2429" stroke="#245A54" stroke-width="1" />
  <text x="385" y="85" fill="#788691" font-family="sans-serif" font-size="11">Overselling Rate</text>
  <text x="385" y="115" fill="#458B82" font-family="sans-serif" font-size="24" font-weight="bold">0.00%</text>
  <text x="385" y="135" fill="#C2CACE" font-family="sans-serif" font-size="11">Across 12,000 Concurrent Carts</text>
  <text x="385" y="155" fill="#8FA89B" font-family="sans-serif" font-size="11">Throughput: 3.2x Faster</text>

  <rect x="370" y="200" width="200" height="130" rx="8" fill="#1C2429" stroke="#2B363E" stroke-width="1" />
  <text x="385" y="225" fill="#788691" font-family="sans-serif" font-size="11">Database Transactions</text>
  <text x="385" y="255" fill="#F4F6F7" font-family="sans-serif" font-size="20" font-weight="bold">SERIALIZABLE</text>
  <text x="385" y="278" fill="#A2B2AE" font-family="sans-serif" font-size="11">T-SQL Stored Procedures</text>
  <text x="385" y="300" fill="#A2B2AE" font-family="sans-serif" font-size="11">Zero Deadlock Collisions</text>
</svg>
