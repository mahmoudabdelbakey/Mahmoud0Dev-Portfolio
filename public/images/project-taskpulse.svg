<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="tpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#192022" />
      <stop offset="100%" stop-color="#131718" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" rx="12" fill="url(#tpGrad)" />

  <!-- App Chrome -->
  <rect width="600" height="40" fill="#14191A" rx="12 12 0 0" />
  <circle cx="25" cy="20" r="5" fill="#E06C75" />
  <circle cx="45" cy="20" r="5" fill="#E5C07B" />
  <circle cx="65" cy="20" r="5" fill="#98C379" />
  <rect x="120" y="10" width="360" height="20" rx="4" fill="#1F2628" />
  <text x="220" y="24" fill="#7B8B8F" font-family="sans-serif" font-size="11">taskpulse.internal/sprint/board-active</text>

  <!-- 3 Kanban Columns -->
  <!-- Column 1: Ready / Backlog -->
  <rect x="30" y="60" width="165" height="270" rx="8" fill="#1B2224" stroke="#283336" stroke-width="1" />
  <text x="45" y="85" fill="#7B8B8F" font-family="sans-serif" font-size="12" font-weight="bold">BACKLOG (4)</text>
  <rect x="42" y="100" width="141" height="60" rx="6" fill="#222B2E" />
  <rect x="52" y="112" width="80" height="6" rx="2" fill="#245A54" />
  <rect x="52" y="125" width="115" height="5" rx="2" fill="#4B565A" />
  <rect x="42" y="170" width="141" height="60" rx="6" fill="#222B2E" />
  <rect x="52" y="182" width="70" height="6" rx="2" fill="#3D7B73" />
  <rect x="52" y="195" width="105" height="5" rx="2" fill="#4B565A" />

  <!-- Column 2: In Progress -->
  <rect x="215" y="60" width="165" height="270" rx="8" fill="#1B2224" stroke="#245A54" stroke-width="1.5" />
  <text x="230" y="85" fill="#458B82" font-family="sans-serif" font-size="12" font-weight="bold">IN DEVELOPMENT</text>
  <rect x="227" y="100" width="141" height="85" rx="6" fill="#202A2D" stroke="#245A54" stroke-width="1" />
  <rect x="237" y="115" width="90" height="7" rx="2" fill="#458B82" />
  <rect x="237" y="130" width="115" height="5" rx="2" fill="#8EA39C" />
  <rect x="237" y="142" width="70" height="5" rx="2" fill="#8EA39C" />
  <circle cx="345" cy="165" r="10" fill="#245A54" />

  <!-- Column 3: Quality & Verified -->
  <rect x="400" y="60" width="170" height="270" rx="8" fill="#1B2224" stroke="#283336" stroke-width="1" />
  <text x="415" y="85" fill="#6E897B" font-family="sans-serif" font-size="12" font-weight="bold">DONE &amp; VERIFIED</text>
  <rect x="412" y="100" width="146" height="60" rx="6" fill="#222B2E" />
  <rect x="422" y="112" width="100" height="6" rx="2" fill="#6E897B" />
  <rect x="422" y="125" width="115" height="5" rx="2" fill="#4B565A" />
  <rect x="412" y="170" width="146" height="60" rx="6" fill="#222B2E" />
  <rect x="422" y="182" width="85" height="6" rx="2" fill="#6E897B" />
  <rect x="422" y="195" width="115" height="5" rx="2" fill="#4B565A" />
</svg>
