<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2226" />
      <stop offset="60%" stop-color="#245A54" />
      <stop offset="100%" stop-color="#14181A" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EACBB5" />
      <stop offset="100%" stop-color="#D7B59D" />
    </linearGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2A3238" />
      <stop offset="100%" stop-color="#181D21" />
    </linearGradient>
    <linearGradient id="tealGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A7871" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#245A54" stop-opacity="0.2" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Architecture Pattern -->
  <rect width="480" height="520" rx="24" fill="url(#bgGrad)" />

  <!-- Geometric Subtle Grid Nodes -->
  <g opacity="0.15" stroke="#E2EBE6" stroke-width="1">
    <line x1="40" y1="40" x2="440" y2="40" />
    <line x1="40" y1="120" x2="440" y2="120" />
    <line x1="40" y1="200" x2="440" y2="200" />
    <line x1="40" y1="280" x2="440" y2="280" />
    <line x1="40" y1="360" x2="440" y2="360" />
    <line x1="40" y1="440" x2="440" y2="440" />
    <line x1="100" y1="40" x2="100" y2="480" />
    <line x1="240" y1="40" x2="240" y2="480" />
    <line x1="380" y1="40" x2="380" y2="480" />
  </g>

  <!-- Ambient Light Halo -->
  <circle cx="240" cy="220" r="160" fill="url(#tealGlow)" />

  <!-- Code / Architecture Floating Symbols -->
  <g opacity="0.4" fill="#94AC9F" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600">
    <text x="60" y="90">&lt;C# /&gt;</text>
    <text x="350" y="100">ASP.NET 10</text>
    <text x="50" y="320">EF Core</text>
    <text x="360" y="300">SQL Server</text>
    <text x="80" y="440">API.REST</text>
  </g>

  <!-- Portrait Silhouette / Stylized Character -->
  <g filter="url(#softShadow)">
    <!-- Shoulders & Coat -->
    <path d="M120 520 C120 420, 160 380, 240 380 C320 380, 360 420, 360 520 Z" fill="url(#suitGrad)" />
    
    <!-- White Inner Collar Shirt -->
    <path d="M210 380 L240 440 L270 380 L255 355 L225 355 Z" fill="#F4F2EE" />
    <path d="M240 440 L240 520" stroke="#245A54" stroke-width="4" />

    <!-- Neck -->
    <rect x="218" y="300" width="44" height="65" rx="8" fill="url(#skinGrad)" />

    <!-- Head & Face -->
    <ellipse cx="240" cy="230" rx="68" ry="85" fill="url(#skinGrad)" />

    <!-- Hair Style (Modern Clean Short Cut) -->
    <path d="M170 215 C170 145, 205 130, 240 130 C275 130, 310 145, 310 215 C310 185, 295 160, 240 158 C185 160, 170 185, 170 215 Z" fill="#1C1816" />
    
    <!-- Professional Eyeglasses -->
    <rect x="190" y="208" width="38" height="26" rx="6" fill="none" stroke="#245A54" stroke-width="3.5" />
    <rect x="252" y="208" width="38" height="26" rx="6" fill="none" stroke="#245A54" stroke-width="3.5" />
    <line x1="228" y1="218" x2="252" y2="218" stroke="#245A54" stroke-width="3.5" />
    <!-- Eyes -->
    <circle cx="209" cy="221" r="3.5" fill="#1F2428" />
    <circle cx="271" cy="221" r="3.5" fill="#1F2428" />
    
    <!-- Eyebrows -->
    <path d="M192 198 Q209 193 226 198" stroke="#1C1816" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <path d="M254 198 Q271 193 288 198" stroke="#1C1816" stroke-width="3.5" stroke-linecap="round" fill="none" />

    <!-- Nose -->
    <path d="M240 220 L237 245 L245 245" stroke="#C8A085" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Thoughtful Confident Smile -->
    <path d="M225 268 Q240 278 255 268" stroke="#9E6E56" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- Neat Trimmed Beard & Jawline Contour -->
    <path d="M178 230 C178 290, 205 315, 240 315 C275 315, 302 290, 302 230 C295 245, 280 300, 240 300 C200 300, 185 245, 178 230 Z" fill="#2A2421" opacity="0.85" />
  </g>

  <!-- Tech Indicator Overlay Badge -->
  <g transform="translate(140, 465)">
    <rect width="200" height="38" rx="19" fill="#15181A" stroke="#3A7871" stroke-width="1.5" />
    <circle cx="22" cy="19" r="6" fill="#6E897B" />
    <text x="36" y="24" fill="#F4F6F7" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" letter-spacing="0.05em">FULL STACK .NET</text>
  </g>
</svg>
